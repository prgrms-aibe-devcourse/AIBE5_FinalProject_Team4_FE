name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: gemini-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Gemini Code Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 스킵 조건 확인
        id: skip-check
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if echo "$PR_TITLE" | grep -qE '^(chore|docs):'; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "reason=chore/docs PR — 리뷰 스킵" >> $GITHUB_OUTPUT
            exit 0
          fi

          git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} \
            -- 'src/**/*.ts' 'src/**/*.tsx' > changed_files.txt

          CHANGED_COUNT=$(wc -l < changed_files.txt | tr -d ' ')
          TOTAL_FILES=$(git diff --name-only \
            ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} \
            | wc -l | tr -d ' ')

          STAT=$(git diff --shortstat \
            ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} \
            -- 'src/**/*.ts' 'src/**/*.tsx')
          INS=$(echo "$STAT" | grep -oE '[0-9]+ insertion' | grep -oE '[0-9]+' || echo 0)
          DEL=$(echo "$STAT" | grep -oE '[0-9]+ deletion' | grep -oE '[0-9]+' || echo 0)
          TOTAL_LINES=$((INS + DEL))

          echo "ts/tsx: ${CHANGED_COUNT}개 | 전체: ${TOTAL_FILES}개 | 라인: ${TOTAL_LINES}줄"

          if [ "$CHANGED_COUNT" -le 1 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "reason=변경된 ts/tsx 파일이 ${CHANGED_COUNT}개 — 리뷰 스킵" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "$TOTAL_LINES" -le 50 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "reason=변경 라인 합계 ${TOTAL_LINES}줄 — 리뷰 스킵" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "$TOTAL_FILES" -gt 10 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "reason=변경 파일 ${TOTAL_FILES}개 초과 — 리뷰 스킵" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "skip=false" >> $GITHUB_OUTPUT

      - name: 스킵 사유 코멘트
        if: steps.skip-check.outputs.skip == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "## 🤖 Gemini 코드 리뷰
          ⏭️ **리뷰 스킵**: ${{ steps.skip-check.outputs.reason }}"

      - name: Get PR diff
        if: steps.skip-check.outputs.skip == 'false'
        run: |
          git diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} \
            -- 'src/**/*.ts' 'src/**/*.tsx' > pr_diff.txt
          echo "diff 크기: $(wc -c < pr_diff.txt) bytes"

      - name: Run Gemini Code Review
        if: steps.skip-check.outputs.skip == 'false'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/gemini_review.py
